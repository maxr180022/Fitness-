name: Android APK

# APK собирается заново только при изменении Android-части.
# Тренировки, питание и видео обновляются через GitHub Pages без пересборки.
on:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'package.json'
      - 'assets/**'
      - 'www/**'
      - 'ci/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons
        run: npx capacitor-assets generate --android

      - name: Sync
        run: npx cap sync android

      - name: Version code
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Fixed debug key (same signature on every build, so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Fitness.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Fitness.apk --title "Фитнес для Android" --notes "Установочный файл Android-приложения «Фитнес». Скачай Fitness.apk и установи."
